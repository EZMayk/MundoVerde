<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test WebSocket Clima - MundoVerde</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            color: #2d3436;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #0984e3;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        .controls {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        input, button {
            padding: 12px 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        input {
            flex: 1;
            min-width: 250px;
        }
        button {
            background: #00b894;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        button:hover {
            background: #00a085;
            transform: translateY(-2px);
        }
        button:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
        }
        .status {
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .status.connected {
            background: #d1f2eb;
            color: #00b894;
            border: 2px solid #00b894;
        }
        .status.disconnected {
            background: #fadbd8;
            color: #e74c3c;
            border: 2px solid #e74c3c;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .panel {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            border: 2px solid #e9ecef;
        }
        .panel h3 {
            margin-top: 0;
            color: #2d3436;
            border-bottom: 2px solid #0984e3;
            padding-bottom: 10px;
        }
        .weather-data {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 15px 0;
        }
        .weather-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #ddd;
        }
        .weather-item .label {
            font-size: 12px;
            color: #636e72;
            text-transform: uppercase;
            font-weight: bold;
        }
        .weather-item .value {
            font-size: 24px;
            font-weight: bold;
            color: #2d3436;
            margin-top: 5px;
        }
        .logs {
            max-height: 400px;
            overflow-y: auto;
            background: #2d3436;
            color: #74b9ff;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        .log-entry {
            margin: 5px 0;
            padding: 5px;
            border-left: 3px solid transparent;
        }
        .log-entry.weather { border-left-color: #00b894; }
        .log-entry.alert { border-left-color: #e17055; }
        .log-entry.error { border-left-color: #e74c3c; }
        .log-entry.system { border-left-color: #74b9ff; }
        .timestamp {
            color: #a0a0a0;
            font-size: 12px;
        }
        .severity {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }
        .severity.low { background: #d1f2eb; color: #00b894; }
        .severity.medium { background: #ffeeba; color: #e67e22; }
        .severity.high { background: #f8d7da; color: #e74c3c; }
        .severity.critical { background: #d1ecf1; color: #721c24; }
        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
            .controls { flex-direction: column; }
            .weather-data { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌤️ Test WebSocket Clima - MundoVerde</h1>
        
        <div class="status" id="status">
            🔌 Desconectado del servidor
        </div>

        <div class="controls">
            <input type="text" id="ciudadInput" placeholder="Ingrese nombre de la ciudad..." value="Bogotá">
            <button onclick="obtenerToken()" id="tokenBtn" style="background: #6c5ce7;">🔑 Obtener Token</button>
            <button onclick="consultarClima()" id="consultarBtn">🌍 Consultar Clima</button>
            <button onclick="toggleConnection()" id="connectBtn">🔌 Conectar</button>
            <button onclick="clearLogs()" style="background: #e74c3c;">🗑️ Limpiar Logs</button>
        </div>

        <div class="grid">
            <div class="panel">
                <h3>📊 Datos Climáticos Actuales</h3>
                <div style="margin-bottom: 15px;">
                    <strong>Token Status:</strong> 
                    <span id="tokenStatus" style="color: #e74c3c;">❌ Sin token</span>
                </div>
                <div id="weatherData">
                    <p style="text-align: center; color: #636e72;">No hay datos disponibles</p>
                </div>
            </div>

            <div class="panel">
                <h3>📡 Eventos WebSocket en Tiempo Real</h3>
                <div class="logs" id="logs">
                    <div class="log-entry system">
                        <span class="timestamp">[Inicio]</span> Sistema iniciado. Presiona "Conectar" para comenzar.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let socket = null;
        let isConnected = false;

        function addLog(message, type = 'system') {
            const logs = document.getElementById('logs');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry ${type}`;
            logEntry.innerHTML = `<span class="timestamp">[${timestamp}]</span> ${message}`;
            logs.appendChild(logEntry);
            logs.scrollTop = logs.scrollHeight;
        }

        function updateStatus(connected) {
            const status = document.getElementById('status');
            const connectBtn = document.getElementById('connectBtn');
            
            isConnected = connected;
            
            if (connected) {
                status.textContent = '🟢 Conectado al servidor WebSocket';
                status.className = 'status connected';
                connectBtn.textContent = '🔌 Desconectar';
            } else {
                status.textContent = '🔴 Desconectado del servidor';
                status.className = 'status disconnected';
                connectBtn.textContent = '🔌 Conectar';
            }
        }

        function connectWebSocket() {
            try {
                socket = io('http://localhost:3000');
                
                socket.on('connect', () => {
                    updateStatus(true);
                    addLog('✅ Conectado exitosamente al servidor WebSocket', 'system');
                    
                    // Suscribirse a actualizaciones de clima
                    socket.emit('subscribe-weather');
                    addLog('📡 Suscrito a actualizaciones de clima en tiempo real', 'system');
                    
                    // También suscribirse al dashboard
                    socket.emit('subscribe-dashboard');
                    addLog('📊 Suscrito al dashboard general', 'system');
                });

                socket.on('disconnect', () => {
                    updateStatus(false);
                    addLog('❌ Desconectado del servidor WebSocket', 'system');
                });

                // Escuchar actualizaciones de clima
                socket.on('weather:updated', (data) => {
                    addLog(`🌤️ Actualización climática: ${data.ciudad} - ${data.temperatura}°C`, 'weather');
                    updateWeatherDisplay(data);
                });

                // Escuchar alertas climáticas
                socket.on('weather:alert', (data) => {
                    addLog(`⚠️ ALERTA CLIMÁTICA: ${data.message} <span class="severity ${data.severity}">${data.severity.toUpperCase()}</span>`, 'alert');
                });

                // Escuchar eventos del dashboard
                socket.on('dashboard:real-time', (data) => {
                    if (data.module === 'clima') {
                        addLog(`📊 Dashboard - ${data.type}: ${data.data.ciudad}`, 'system');
                    }
                });

                // Escuchar eventos entre módulos
                socket.on('weather:affects-crop', (data) => {
                    addLog(`🌱 Impacto en cultivos: ${data.data.recommendation}`, 'weather');
                });

                socket.on('connect_error', (error) => {
                    addLog(`❌ Error de conexión: ${error.message}`, 'error');
                });

            } catch (error) {
                addLog(`❌ Error al conectar: ${error.message}`, 'error');
            }
        }

        function disconnectWebSocket() {
            if (socket) {
                socket.disconnect();
                socket = null;
            }
            updateStatus(false);
        }

        function toggleConnection() {
            if (isConnected) {
                disconnectWebSocket();
            } else {
                connectWebSocket();
            }
        }

        function updateWeatherDisplay(data) {
            const weatherData = document.getElementById('weatherData');
            
            weatherData.innerHTML = `
                <div class="weather-data">
                    <div class="weather-item">
                        <div class="label">Ciudad</div>
                        <div class="value">${data.ciudad}</div>
                    </div>
                    <div class="weather-item">
                        <div class="label">Temperatura</div>
                        <div class="value">${data.temperatura}°C</div>
                    </div>
                    <div class="weather-item">
                        <div class="label">Humedad</div>
                        <div class="value">${data.humedad}%</div>
                    </div>
                    <div class="weather-item">
                        <div class="label">Presión</div>
                        <div class="value">${data.presion} hPa</div>
                    </div>
                    <div class="weather-item">
                        <div class="label">Viento</div>
                        <div class="value">${data.viento} m/s</div>
                    </div>
                    <div class="weather-item">
                        <div class="label">Descripción</div>
                        <div class="value" style="font-size: 16px;">${data.descripcion}</div>
                    </div>
                </div>
                <div style="margin-top: 15px; text-align: center;">
                    <span class="severity ${data.severity}">Severidad: ${data.severity.toUpperCase()}</span>
                    <br><small class="timestamp">Última actualización: ${new Date(data.timestamp).toLocaleString()}</small>
                </div>
            `;
        }

        async function consultarClima() {
            const ciudad = document.getElementById('ciudadInput').value.trim();
            const btn = document.getElementById('consultarBtn');
            const token = localStorage.getItem('token');
            
            if (!ciudad) {
                alert('Por favor, ingrese el nombre de una ciudad');
                return;
            }

            if (!token) {
                addLog('⚠️ No hay token disponible. Presiona "Obtener Token" primero.', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = '⏳ Consultando...';

            try {
                // Realizar consulta al API (que debería generar eventos WebSocket)
                const response = await fetch(`http://localhost:3000/api/consulta-clima?ciudad=${encodeURIComponent(ciudad)}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    addLog(`✅ Consulta API exitosa para ${ciudad}`, 'system');
                    
                    // Los eventos WebSocket deberían llegar automáticamente
                    if (!isConnected) {
                        addLog('ℹ️ Conéctate al WebSocket para recibir actualizaciones en tiempo real', 'system');
                        // Mostrar datos al menos una vez
                        if (data.clima) {
                            updateWeatherDisplay({
                                ciudad: data.ciudad,
                                temperatura: data.clima.temperatura,
                                humedad: data.clima.humedad,
                                presion: data.clima.presion,
                                viento: data.clima.viento,
                                descripcion: data.clima.descripcion,
                                severity: 'low',
                                timestamp: new Date()
                            });
                        }
                    }
                } else if (response.status === 401 || response.status === 403) {
                    const error = await response.json();
                    addLog(`❌ Token inválido o expirado: ${error.error}`, 'error');
                    localStorage.removeItem('token');
                    document.getElementById('tokenStatus').textContent = '❌ Token expirado';
                    document.getElementById('tokenStatus').style.color = '#e74c3c';
                    addLog('💡 Presiona "Obtener Token" para obtener uno nuevo', 'system');
                } else {
                    const error = await response.json();
                    addLog(`❌ Error en consulta API: ${error.error || 'Error desconocido'}`, 'error');
                }
            } catch (error) {
                addLog(`❌ Error de red: ${error.message}`, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '🌍 Consultar Clima';
            }
        }

        async function obtenerToken() {
            const tokenBtn = document.getElementById('tokenBtn');
            const tokenStatus = document.getElementById('tokenStatus');
            
            tokenBtn.disabled = true;
            tokenBtn.textContent = '⏳ Obteniendo...';

            try {
                const response = await fetch('http://localhost:3000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        usuario: 'admin',
                        contraseña: '1234'
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('token', data.token);
                    tokenStatus.textContent = '✅ Token válido';
                    tokenStatus.style.color = '#00b894';
                    addLog('✅ Token obtenido exitosamente', 'system');
                    addLog(`🔑 Token: ${data.token.substring(0, 20)}...`, 'system');
                } else {
                    const error = await response.json();
                    addLog(`❌ Error al obtener token: ${error.error}`, 'error');
                    tokenStatus.textContent = '❌ Error al obtener token';
                    tokenStatus.style.color = '#e74c3c';
                }
            } catch (error) {
                addLog(`❌ Error de red al obtener token: ${error.message}`, 'error');
                tokenStatus.textContent = '❌ Error de red';
                tokenStatus.style.color = '#e74c3c';
            } finally {
                tokenBtn.disabled = false;
                tokenBtn.textContent = '🔑 Obtener Token';
            }
        }

        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
            addLog('🗑️ Logs limpiados', 'system');
        }

        // Permitir consulta con Enter
        document.getElementById('ciudadInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                consultarClima();
            }
        });

        // Información inicial
        addLog('🌟 Bienvenido al Test de WebSocket Clima MundoVerde', 'system');
        addLog('📋 Instrucciones:', 'system');
        addLog('1. Presiona "Obtener Token" para autenticarte', 'system');
        addLog('2. Presiona "Conectar" para establecer conexión WebSocket', 'system');
        addLog('3. Ingresa una ciudad y presiona "Consultar Clima"', 'system');
        addLog('4. Observa las actualizaciones en tiempo real', 'system');
        
        // Verificar si ya hay un token guardado
        const existingToken = localStorage.getItem('token');
        if (existingToken) {
            document.getElementById('tokenStatus').textContent = '✅ Token guardado';
            document.getElementById('tokenStatus').style.color = '#00b894';
            addLog('💾 Token encontrado in localStorage', 'system');
        }
    </script>
</body>
</html>
